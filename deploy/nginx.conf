worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Query strings, authorization headers, and cookies are deliberately absent.
    log_format mesthi '$request_id $remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout mesthi;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1m;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    map $request_method $is_write { default 1; GET 0; HEAD 0; }
    map "$is_write:$http_origin:$http_x_mesthi_request" $reject_csrf {
        default 1;
        ~^0: 0;
        "1:https://ai.mesthi.com:1" 0;
    }
    map $request_method $reject_method { default 1; GET 0; HEAD 0; POST 0; PATCH 0; DELETE 0; }
    map $uri $api_path_allowed {
        default 0;
        ~^/api/v1/(me|models|billing/plans|workspaces)$ 1;
        "~^/api/v1/workspaces/[a-fA-F0-9-]{36}(/(agents|tasks|entitlements))?$" 1;
        "~^/api/v1/workspaces/[a-fA-F0-9-]{36}/(agents|tasks)/[a-fA-F0-9-]{36}$" 1;
        "~^/api/v1/workspaces/[a-fA-F0-9-]{36}/tasks/[a-fA-F0-9-]{36}/(queue|start|cancel)$" 1;
    }
    server {
        listen 8080;
        server_name ai.mesthi.com;
        root /usr/share/nginx/html;
        include /etc/nginx/mesthi/security-headers.conf;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location = /_auth {
            internal;
            proxy_pass http://auth:4180/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host ai.mesthi.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host ai.mesthi.com;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header Authorization "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header X-Auth-Request-Email "";
            proxy_set_header X-Auth-Request-Access-Token "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_next_upstream off;
        }
        location ~ ^/oauth2/(start|callback|sign_in|sign_out)$ {
            include /etc/nginx/mesthi/security-headers.conf;
            # OIDC uses top-level redirects; CSP form-action remains same-origin.
            add_header Cache-Control "no-store" always;
            proxy_pass http://auth:4180;
            proxy_set_header Host ai.mesthi.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host ai.mesthi.com;
            proxy_set_header X-Auth-Request-Redirect https://ai.mesthi.com/;
            proxy_set_header Authorization "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header X-Auth-Request-Email "";
            proxy_set_header X-Auth-Request-Access-Token "";
            proxy_hide_header X-Auth-Request-Access-Token;
            proxy_hide_header X-Access-Token;
            proxy_hide_header Authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_next_upstream off;
        }
        location /oauth2/ { return 404; }
        location /api/ {
            if ($api_path_allowed = 0) { return 404; }
            if ($reject_method) { return 405; }
            if ($reject_csrf) { return 403; }
            auth_request /_auth;
            auth_request_set $session_token $upstream_http_x_auth_request_access_token;
            auth_request_set $session_cookie $upstream_http_set_cookie;
            include /etc/nginx/mesthi/security-headers.conf;
            add_header Cache-Control "no-store" always;
            add_header X-Request-ID $request_id always;
            add_header Set-Cookie $session_cookie always;
            # No browser Authorization or identity header is trusted.
            proxy_pass_request_headers off;
            proxy_set_header Accept application/json;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Authorization "Bearer $session_token";
            proxy_set_header Cookie "";
            proxy_set_header X-User "";
            proxy_set_header X-Email "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header X-Auth-Request-Email "";
            proxy_set_header X-Auth-Request-Access-Token "";
            proxy_set_header X-Access-Token "";
            proxy_set_header X-Mesthi-Request "";
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Host api.mesthi.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host ai.mesthi.com;
            proxy_hide_header Set-Cookie;
            proxy_hide_header X-Auth-Request-Access-Token;
            proxy_hide_header X-Access-Token;
            proxy_hide_header Authorization;
            proxy_cache off;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_ssl_server_name on;
            proxy_ssl_name api.mesthi.com;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_pass https://api.mesthi.com/;
        }
        location /assets/ {
            include /etc/nginx/mesthi/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location = /index.html {
            include /etc/nginx/mesthi/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
