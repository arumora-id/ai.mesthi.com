name: Frontend validation

on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm ci
      - name: Source formatting
        run: npm run format:check
      - name: TypeScript and production build
        run: npm run build
      - name: Domain and C4 contract tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser flows and screenshots
        run: npm run test:e2e
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation
          path: |
            dist/
            playwright-report/
            test-results/
            docs/screenshots/
            package-lock.json
          retention-days: 14

  record-previews:
    needs: validate
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/feat/autonomous-workspace-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Check whether preview images are already recorded
        id: previews
        run: |
          if git ls-files --error-unmatch docs/screenshots/mission-control.png >/dev/null 2>&1; then
            echo 'record=false' >> "$GITHUB_OUTPUT"
          else
            echo 'record=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.previews.outputs.record == 'true'
        with:
          name: frontend-validation
          path: /tmp/mesthi-validation
      - name: Record captured demo previews on the feature branch
        if: steps.previews.outputs.record == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          FEATURE_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then exit 0; fi
          if [ ! -f /tmp/mesthi-validation/docs/screenshots/mission-control.png ]; then exit 0; fi
          mkdir -p docs/screenshots
          cp /tmp/mesthi-validation/docs/screenshots/*.png docs/screenshots/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: record demo workspace previews for review"
          git push origin "HEAD:$FEATURE_BRANCH"
